services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: 9ja
      POSTGRES_PASSWORD: 9ja
      POSTGRES_DB: 9jasingles
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["3000:3000"]

volumes:
  pgdata:
